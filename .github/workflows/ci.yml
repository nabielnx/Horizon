name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc -Vv
      - name: Format, lint, test and package
        shell: pwsh
        run: ./build.ps1
      - name: Native offscreen checks
        shell: pwsh
        run: ./scripts/verify.ps1 -SkipPreviews
      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: horizon-windows-x64
          path: |
            artifacts/Horizon-*-win-x64.zip
            artifacts/Horizon-*-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
