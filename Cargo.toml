[package]
name = "horizon"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]
svgtypes = "0.15"
windows-numerics = "0.3.1"
windows-future = "0.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
chrono = { version = "0.4", features = ["serde"] }
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Foundation", "Win32_System_Power", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Networking_WinHttp", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Imaging", "Win32_Graphics_Dwm", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Diagnostics_Debug", "Win32_Storage_FileSystem", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole", "Foundation", "Media_Control", "Media_SpeechRecognition", "Storage_Streams"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
